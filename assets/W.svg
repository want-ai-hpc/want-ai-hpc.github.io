<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
>
  <!-- Background rectangle -->
  <rect width="200" height="200" fill="#F2F2F2" />

  <!-- Neural network connections -->
  <line x1="50" y1="100" x2="100" y2="50" stroke="#3B82F6" stroke-width="2" />
  <line x1="100" y1="50" x2="150" y2="100" stroke="#3B82F6" stroke-width="2" />
  <line x1="50" y1="100" x2="100" y2="150" stroke="#3B82F6" stroke-width="2" />
  <line x1="100" y1="150" x2="150" y2="100" stroke="#3B82F6" stroke-width="2" />

  <!-- Letter "W" shape -->
  <text
    x="50%"
    y="60%"
    dominant-baseline="middle"
    text-anchor="middle"
    font-size="120"
    font-weight="bold"
    fill="#333333"
  >
    W
  </text>
</svg>
